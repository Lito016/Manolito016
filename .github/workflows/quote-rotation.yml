name: Rotate Tech Quote

on:
  schedule:
    - cron: "0 6 * * *"  # Runs daily at 6 AM UTC
  workflow_dispatch:

jobs:
  update-quote:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and update quote
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Array of curated tech/AI quotes
          QUOTES=(
            "The best way to predict the future is to invent it. — Alan Kay"
            "Any sufficiently advanced technology is indistinguishable from magic. — Arthur C. Clarke"
            "First, solve the problem. Then, write the code. — John Johnson"
            "Code is like humor. When you have to explain it, it's bad. — Cory House"
            "AI is not a replacement for human intelligence — it's a tool to amplify it."
            "The only way to do great work is to love what you do. — Steve Jobs"
            "Simplicity is the soul of efficiency. — Austin Freeman"
            "Make it work, make it right, make it fast. — Kent Beck"
            "Talk is cheap. Show me the code. — Linus Torvalds"
            "Programs must be written for people to read, and only incidentally for machines to execute. — Harold Abelson"
            "The most dangerous phrase in the language is 'We've always done it this way.' — Grace Hopper"
            "Innovation distinguishes between a leader and a follower. — Steve Jobs"
            "Clean code always looks like it was written by someone who cares. — Robert C. Martin"
            "Artificial intelligence is the new electricity. — Andrew Ng"
            "The advance of technology is based on making it fit in so that you don't really even notice it. — Bill Gates"
            "Debugging is twice as hard as writing the code in the first place. — Brian Kernighan"
            "Perfection is achieved not when there is nothing more to add, but when there is nothing left to take away. — Antoine de Saint-Exupery"
            "Before software can be reusable, it first has to be usable. — Ralph Johnson"
            "The function of good software is to make the complex appear to be simple. — Grady Booch"
            "Machine intelligence is the last invention that humanity will ever need to make. — Nick Bostrom"
            "It's not that we use technology, we live technology. — Godfrey Reggio"
            "JavaScript is the world's most misunderstood programming language. — Douglas Crockford"
            "The web as I envisaged it, we have not seen it yet. — Tim Berners-Lee"
            "Good code is its own best documentation. — Steve McConnell"
            "Measuring programming progress by lines of code is like measuring aircraft building progress by weight. — Bill Gates"
            "The most important property of a program is whether it accomplishes the intention of its user. — C.A.R. Hoare"
            "Walking on water and developing software from a specification are easy if both are frozen. — Edward V. Berard"
            "One of the best ways to learn is to teach. — Frank Oppenheimer"
            "Computers are useless. They can only give you answers. — Pablo Picasso"
            "An API that isn't trivial to use is, by definition, useless. — Joe Gregorio"
            "The purpose of abstraction is not to be vague, but to create a new semantic level. — Edsger Dijkstra"
          )

          # Pick a random quote based on day of year
          DAY_OF_YEAR=$(date +%j)
          INDEX=$((DAY_OF_YEAR % ${#QUOTES[@]}))
          SELECTED_QUOTE="${QUOTES[$INDEX]}"

          # Update the README
          sed -i "s|<!-- QUOTE:START -->.*<!-- QUOTE:END -->|<!-- QUOTE:START -->${SELECTED_QUOTE}<!-- QUOTE:END -->|" README.md

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update daily tech quote"
          git push
